name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare release
        id: release
        uses: googleapis/release-please-action@v5
        with:
          target-branch: main
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json
