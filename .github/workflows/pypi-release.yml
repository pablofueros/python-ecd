name: PyPI Release

on:
  workflow_run:
    workflows:
      - Release Please
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  release-details:
    name: Validate release
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out released commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Find Release Please tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          tag="v${version}"

          if ! git tag --points-at "$RELEASE_SHA" | grep -Fxq "$tag"; then
            echo "No release tag for $RELEASE_SHA; skipping publication."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          draft=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft')
          if [ "$draft" != "false" ]; then
            echo "GitHub Release $tag is still a draft."
            exit 1
          fi

          {
            echo "publish=true"
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build and validate distributions
    if: ${{ needs.release-details.outputs.publish == 'true' }}
    needs: release-details
    runs-on: ubuntu-latest
    steps:
      - name: Check out released commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-details.outputs.sha }}
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Check lock file
        run: uv lock --check
      - name: Build wheel and source distribution
        run: uv build
      - name: Check distribution metadata
        run: uvx twine check dist/*
      - name: Test wheel installation and import
        run: uv run --isolated --no-project --with ./dist/*.whl -- python -c "from python_ecd.cli import app"
      - name: Upload distributions
        uses: actions/upload-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: ${{ needs.release-details.outputs.publish == 'true' }}
    needs:
      - release-details
      - build
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: python-package-distributions
          path: dist/
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Publish distributions with Trusted Publishing
        run: uv publish --trusted-publishing always dist/*
