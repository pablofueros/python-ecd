name: Coverage

on:
  push:
    branches:
      - main

concurrency:
  group: coverage-main
  cancel-in-progress: true

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install dependencies
        run: uv sync --frozen
      - name: Generate coverage report
        run: |
          if [ -n "$(find tests -name 'test_*.py' -print -quit 2>/dev/null)" ]; then
            uv run --frozen pytest --cov=python_ecd --cov-report=term-missing --cov-report=xml
          else
            echo "No tests found; skipping coverage."
          fi
      - name: Upload coverage to Codecov
        if: ${{ runner.environment == 'github-hosted' && hashFiles('coverage.xml') != '' }}
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          use_oidc: true
          fail_ci_if_error: false
