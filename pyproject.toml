[project]
name = "python-ecd"
version = "0.2.4"
description = "Python CLI for Everybody Codes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pablo Garcia", email = "pablofueros@gmail.com" }]
requires-python = ">=3.13"

dependencies = [
    "everybody-codes-data==0.5",
    "python-dotenv>=1.2.1",
    "typer>=0.20.0",
]

[dependency-groups]
dev = [
    "pytest>=7,<10",
    "pytest-cov>=4.1,<7",
    "ruff>=0.16.10,<1",
    "ty>=0.0.85,<1",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "python_ecd"

[project.scripts]
python-ecd = "python_ecd.cli:app"
ecd = "python_ecd.cli:app"

[project.urls]
Repository = "https://github.com/pablofueros/python-ecd"
Issues = "https://github.com/pablofueros/python-ecd/issues"

[tool.ruff]
lint.extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
"src/python_ecd/cli.py" = ["BLE001"]
"src/python_ecd/utils.py" = ["PYI041", "TRY004"]
"src/python_ecd/version.py" = ["PLR0402"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
